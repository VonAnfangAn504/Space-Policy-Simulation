<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulated Partner Selection Rationales in the U.S. Space Launch Ecosystem</title>
<style>
  :root{
    --ink:#16191d; --ink-2:#4a515b; --ink-3:#7b828c; --line:#e7e9ed; --bg:#ffffff; --bg-2:#f7f8f9;
    --accent:#1f2a37; --edge:#c3c8d0;
    --serif:"Iowan Old Style","Charter","Palatino Linotype","Book Antiqua",Georgia,serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  .app{display:grid;grid-template-rows:auto 1fr;height:100vh;min-height:560px}

  /* ---------- header ---------- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:22px 28px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .titles{max-width:820px}
  h1{font:600 22px/1.25 var(--serif);letter-spacing:-.005em;margin:0;color:#0f1216}
  .hint{margin:6px 0 0;color:var(--ink-3);font-size:13px}
  .controls{display:flex;gap:12px;align-items:center;margin-left:auto}

  .seg{position:relative;display:flex;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{position:relative;z-index:1;border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:550;color:var(--ink-3);transition:color .25s;white-space:nowrap}
  .seg button.on{color:var(--ink)}
  .seg .thumb{position:absolute;top:3px;bottom:3px;border-radius:7px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.08),0 0 0 1px rgba(16,24,40,.06);transition:left .35s cubic-bezier(.4,0,.2,1),width .35s cubic-bezier(.4,0,.2,1)}

  .search{position:relative;width:260px}
  .search input{width:100%;height:36px;border:1px solid var(--line);border-radius:10px;padding:0 12px 0 32px;font:inherit;font-size:13px;background:#fff;outline:none;transition:border-color .15s, box-shadow .15s}
  .search input:focus{border-color:#b9c0ca;box-shadow:0 0 0 3px rgba(31,42,55,.06)}
  .search svg{position:absolute;left:10px;top:11px;color:var(--ink-3)}
  .results{position:absolute;top:40px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(16,24,40,.12);padding:4px;z-index:30;display:none;max-height:340px;overflow:auto}
  .results.open{display:block}
  .res{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:13px}
  .res.act{background:var(--bg-2)}
  .res .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .res .tag{font-size:11px;color:var(--ink-3);white-space:nowrap}
  .res.empty{color:var(--ink-3);cursor:default}

  .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}

  /* ---------- main ---------- */
  main{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
  .stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:
      radial-gradient(circle at 1px 1px,#eef0f3 1px,transparent 0) 0 0/22px 22px;}
  svg#net{position:absolute;inset:0;width:100%;height:100%;cursor:grab;user-select:none;touch-action:none}
  svg#net.drag{cursor:grabbing}
  .kicker{position:absolute;left:24px;top:18px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;pointer-events:none;transition:opacity .3s}

  .bar{position:absolute;left:16px;right:16px;bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
  .legend{display:flex;flex-wrap:wrap;gap:4px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:5px;pointer-events:auto}
  .chip{display:flex;align-items:center;gap:7px;border:0;background:none;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--ink-2);transition:background .15s,opacity .2s}
  .chip:hover{background:var(--bg-2)}
  .chip.off{opacity:.38}
  .chip.off .dot{background:transparent!important}
  .chip.reset{color:var(--ink-3);font-size:12px;display:none}
  .chip.reset.show{display:flex}
  .zoom{display:flex;flex-direction:column;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:12px;padding:4px;pointer-events:auto}
  .zoom button{width:32px;height:32px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--ink-2);display:grid;place-items:center}
  .zoom button:hover{background:var(--bg-2)}

  /* svg */
  .arc{pointer-events:none;fill:none;stroke:var(--edge);stroke-width:.8;opacity:.6;transition:opacity .18s}
  .hit{fill:none;stroke:transparent;stroke-width:9;pointer-events:stroke;cursor:pointer}
  .node circle{cursor:pointer}
  .lbl{font:600 11px var(--sans);fill:#1b1f24;paint-order:stroke;stroke:#fff;stroke-width:3.2px;stroke-linejoin:round;pointer-events:none;text-anchor:middle;dominant-baseline:central}

  /* ---------- tooltip ---------- */
  .tip{position:fixed;z-index:50;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(16,24,40,.14);padding:12px 14px;max-width:380px;opacity:0;transform:translateY(4px);transition:opacity .12s, transform .12s}
  .tip.show{opacity:1;transform:none}
  .tip .t1{font-weight:650;font-size:13.5px;display:flex;align-items:center;gap:4px 8px;flex-wrap:wrap}
  .nt{display:inline-flex;align-items:center;gap:7px}
  .arr{color:var(--ink-3);font-weight:400}
  .tip .t2{font-size:12px;color:var(--ink-3);margin-top:2px}
  .tip ul{margin:8px 0 0}
  .tip .foot{margin-top:8px;font-size:11px;color:var(--ink-3)}

  /* ---------- panel ---------- */
  aside{border-left:1px solid var(--line);overflow:auto;min-height:0;background:#fff}
  .pane{padding:26px 26px 40px;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  .k{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .pane h2{font:600 21px/1.25 var(--serif);margin:6px 0 10px;color:#0f1216}
  .pane h2 .x{color:var(--ink-3);font-weight:400;margin:0 .25em}
  .meta{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;color:var(--ink-2)}
  .back{border:0;background:none;padding:0;margin:0 0 14px;color:var(--ink-3);cursor:pointer;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
  .back:hover{color:var(--ink)}
  .intro p{color:var(--ink-2);margin:10px 0 0}
  .how{margin:22px 0 0;padding:0;list-style:none;display:grid;gap:14px}
  .how li{display:grid;grid-template-columns:28px 1fr;gap:10px;color:var(--ink-2);font-size:13px}
  .how .ic{width:28px;height:28px;border-radius:8px;background:var(--bg-2);display:grid;place-items:center;color:var(--ink-2)}
  .how b{color:var(--ink);font-weight:600;display:block}

  .sec{margin-top:22px}
  .sec .k{margin-bottom:8px}
  .plist{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .prow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer;font-size:13px;transition:background .12s}
  .prow:first-child{border-top:0}
  .prow:hover{background:var(--bg-2)}
  .prow .nm{flex:1;min-width:0}
  .prow .ty{color:var(--ink-3);font-size:11.5px;white-space:nowrap}
  .prow svg{color:#b3b9c2;flex:none}

  .card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px;transition:border-color .2s, box-shadow .2s;background:#fff}
  .card.hl{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 14%,transparent)}
  .card .ch{display:flex;align-items:center;gap:4px 8px;font-weight:650;font-size:13.5px;flex-wrap:wrap}
  .card .ch .arr{color:var(--ink-3);font-weight:400}
  .card .cs{font-size:12px;color:var(--ink-3);margin-top:1px}
  ul.r{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:7px}
  ul.r li{position:relative;padding-left:15px;font-size:13.2px;line-height:1.55;color:#2b3038}
  ul.r li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--c,#9aa1ab)}
  .tip ul.r li{font-size:12.5px}
  .note{margin-top:16px;padding:12px 14px;background:var(--bg-2);border-radius:10px;color:var(--ink-2);font-size:13px}
  .btn{margin-top:10px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12.5px}
  .btn:hover{background:var(--bg-2)}

  @media (max-width:980px){
    main{grid-template-columns:1fr;grid-template-rows:62vh auto}
    aside{border-left:0;border-top:1px solid var(--line)}
    .app{height:auto}
    .search{width:200px}
  }
</style>
</head>

ion as per government policy.","Extensive R&D facilities (centers, test sites), provides access to critical infrastructure, validation, and broad industry acceptance."]},{"s":1,"t":9,"st":["Blue Origin is developing heavy-lift launchers (New Glenn), advanced engines (BE-3/BE-4), and lunar systems with a focus on full private ownership, cost reduction, and service-based models.","Its self-funded approach, upcoming commercial launch capacity, and flexibility align closely with the policy of asset ownership and private-sector operational risk."],"ts":["Well-aligned with Blue Origin’s mission of reducing spaceflight costs and advancing exploration through partnerships, technology transfer, and service-based contracts.","Extensive experience with performance-based, milestone-driven government-industrial partnerships, and history of collaborating with Blue Origin (Artemis, lunar landers).","Provides access to world-class technical expertise, test facilities, and opportunities for co-developing enabling technologies in rocket propulsion, reusable vehicles, and deep space systems."]},{"s":1,"t":18,"st":["Specializes in small/medium launch vehicles with aggressive innovation (3D printing, rapid response), proven Electron vehicle, integrated end-to-end services, and an in-house platform that supports government cost-share, milestone accountability, and shared risk.","Their rideshare and constellation focus also supports NASA’s needs for diversified access."],"ts":["Major funding agency for civil space; deep experience with joint public-private contracts (e.g., CRS, CLPS) similar to policy structure.","Access to facilities, domain expertise, and a pipeline of missions; can help validate Rocket Lab’s technologies and grow its government business."]},{"s":1,"t":19,"st":["Offers modular, scalable launchers (Alpha, Beta), lunar landers, and transfer vehicles with a startup’s agility.","Their approach to rapidly iterating designs and sharing financial and technical risks with partners fits the policy requirements well."],"ts":["NASA’s experience in civil space exploration, launch technology R&D, long history of successful public-private partnerships (e.g., COTS, CLPS, Artemis), and frequent use of milestone-based, fixed-price contracts fit perfectly with government policy direction emphasizing joint development, cost-share, and milestone-driven oversight.","Access to NASA’s test facilities, technical expertise, and market-formation (CLPS, launch purchases) is invaluable for scaling lunar and orbital vehicle services like Firefly’s Blue Ghost and Elytra."]},{"s":1,"t":20,"st":["Pioneers large-scale additive manufacturing for rockets (Terran 1, Terran R), enabling rapid iteration, cost-reduction, and the kind of flexible, commercial innovation the policy seeks to foster—especially for mass production and private ownership."],"ts":["NASA is the principal U.S. civil space agency, experienced in fixed-price and milestone-driven contracting with commercial launch providers.","Provides access to test facilities, technical expertise, and significant validation for technology and service credibility.","Strong supporter of commercial model described in the policy—ownership, service-based procurement, and industry IP retention.","NASA’s deep knowledge in launch operations, technical evaluations, and milestone validation aligns well with the program management style required by the policy."]},{"s":1,"t":21,"st":["Develops Dream Chaser spaceplanes, commercial space stations, and advanced propulsion systems, focusing on reusable, service-based space transport.","Their broad portfolio in space logistics and infrastructure expands NASA’s potential commercial market partners."],"ts":["Deep experience in human spaceflight, technology development partnerships, and robust infrastructure access.","NASA's partnership approach aligns with milestone/goals-based, private-led development and offers valuable visibility, credibility, and testbed access."]},{"s":1,"t":23,"st":["The ULA is transitioning (with Vulcan, partnerships) to a commercial, performance-based, cost-sharing model.","Their experience, relationships, and reliability make them a critical “anchor” service provider and competitor for commercial contracts under the new policy structure."],"ts":["Essential partner with deep experience in civil spaceflight, R&D, advanced technology, and commercial partnership management.","Brings technical advice, milestone validation, and access to facilities/test infrastructure; crucial for accessing contracts under new policy."]},{"s":2,"t":5,"st":["Deep experience in launch vehicle manufacturing and integration for DoD/civil space.","Advanced technologies aligned with USSF priorities (early warning, secure comms, AI/ML in space systems).","Historical success with milestone-driven, performance-based contracts with government."],"ts":["Key customer for military satellites, missile warning, and launch services.","Strategic alignment for national security and dual-use technology.","Provides stable demand for launch services and next-generation space assets."]},{"s":2,"t":7,"st":["World leader in solid rocket propulsion and launch vehicle manufacture.","Critical expertise in missile warning, defense, and integration with military space operations.","Strong alignment with shared risk, performance-milestone contracts."],"ts":["Core customer for missile defense, satellite warning, and launch services.","Aligned focus on space domain awareness and missile warning/tracking.","Key partner for milestone-driven and performance-based contracts in national security launches."]},{"s":2,"t":8,"st":["Industry leader in cost-effective, high-cadence launch.","Proven business model on fixed-price, commercial-public cost-sharing.","Extensive infrastructure for launch services, full/partial reusability, and assured access to space."],"ts":["Drives U.S. government demand for assured launch, relevant for anchor customer and key commercial demand as required by policy.","Strong focus on milestone-driven acquisition, fixed-price launches, and performance oversight.","Supports dual-use technology and rapid launch capabilities, fostering commercialization as in policy."]},{"s":2,"t":9,"st":["Emerging capabilities in heavy-lift, reusability, and alternative launch architectures.","Strong focus on private ownership/operations, which matches policy for commercial risk/operations."],"ts":["Shares strong interest in assured access to space, launch services, and domain awareness, which fits Blue Origin’s heavy-lift capabilities (New Glenn) and advanced propulsion technology.","Experience structuring risk/reward contracts and rapid milestone-driven initiatives.","Potential long-term customer for heavy-lift and rapid launch services under service-based procurement structure."]},{"s":2,"t":10,"st":["Key supplier of communications, avionics, and propulsion.","Valuable for launch support equipment; critical for assured comms and situational awareness."],"ts":["Key government customer and co-development partner for military Satcom, situational awareness, EW, and advanced launch vehicle support.","Demand for secure, resilient communications, propulsion, sensors, and launch support matches L3Harris’ strengths and strategic interests."]},{"s":2,"t":15,"st":["Leading rocket propulsion developer; compatibility across many DoD/commercial Launch Service Providers.","Extensive history with DoD on milestone and fixed-price contracts."],"ts":["Key customer and guiding agency for national security and missile defense propulsion—an Aerojet rocketdyne core business.","Allows industry-led design, access to stable service revenue, focused on outcomes over process."]},{"s":2,"t":18,"st":["High volume, low-cost launches; flexibility and innovation in providing launch services.","Demonstrated public-private approaches; expertise aligning well with small-scale, milestone-based funding."],"ts":["Vital customer for responsive, small- and medium-lift launches; mission fit with national security launches, resilient constellations.","Funding for rapid innovation and capabilities aligned with Rocket Lab’s Electron/Neutron."]},{"s":2,"t":19,"st":["Innovative, cost-competitive medium/small launch solutions; rapid growth and agile development model.","Demonstrated willingness for cost-share, milestone funding, and commercial operation."],"ts":["US Space Force is a major institutional market for launch and satellite services, aligning with the government’s intention to use services rather than own assets.","USSF’s focus on assured access to space, rapid and responsive launch, and procurement of commercial launch services matches Firefly’s fast, flexible launch and cislunar capabilities."]},{"s":2,"t":20,"st":["Advanced, vertically integrated 3D printing capabilities for rapid, flexible launch vehicle manufacturing.","Matches intent for goal-based design, company-led approach, and minimal government overhead."],"ts":["Military orbital launch is a high-growth market; USSF offers technical oversight, major procurement contracts, and robust milestone-driven contracting culture.","Launch assurance, risk sharing, assured access, and procurement of private launch services for critical government payloads fit perfectly with the policy direction.","Their mission priorities (responsive launch, launch site operations, and ability to terminate contracts for non-performance) mirror this policy structure."]},{"s":2,"t":21,"st":["Reusable space transportation, Dream Chaser platform, space station modules.","Private operation/ownership; history of DoD/NASA partnerships under fixed-price, performance models."],"ts":["National security/military user, likely to buy services, set strategic requirements, and co-fund technologies for resilience/assured access—aligns with Sierra Space’s offerings in national security satellites and on-orbit services."]},{"s":2,"t":23,"st":["Proven launch reliability and strong record with both government and commercial launches.","Joint venture with history of navigating government acquisition models, shared risk, and commercial responsibility."],"ts":["Core customer for national security launches; as policy focuses on government as anchor customer and cost-sharing, close relationship will drive mission assurance and access to dedicated funding for R&D and service procurement."]},{"s":2,"t":65,"st":["Mobile launch concepts, cost-effective small launchers, strong commercial orientation.","Suited for flexible government support of persistent/assured launch ops."],"ts":["Mission Fit: USSF’s focus aligns with ABL’s emerging interests in missile defense and rapid, resilient launch operations.","Market Opportunity: Direct government service procurement is likely, given the USSF’s “assured access to space” and tactical/missile defense needs.","Policy Alignment: USSF practices milestone-driven, cost-shared contracts with performance oversight, closely matching the described policy."]},{"s":2,"t":96,"st":["Specialization in advanced, high-cadence propulsion development and rapid prototyping."],"ts":["Clear alignment with defense, hypersonics, and launch vehicle focus.","USSF’s acquisition and sustainment programs match the Series D funding/scale and technology-readiness of Ursa Major.","Shared risk, performance-based, milestone-driven contracting compatible with USSF procurement approaches.","Direct customer/market for Ursa Major’s engines and SRM products."]},{"s":2,"t":101,"st":["Test and real-time simulation expertise; critical for launch vehicle and ground support development.","Proven record supporting government/industry integration with milestone-based delivery."],"ts":["Space Force is a direct customer and systems integrator for military, launch, and mission-critical electronics and ground support/training equipment.","They seek commercial technology solutions, value rapid milestone-driven results, and foster dual-use systems for both defense and civil/commercial launch markets.","Likely to benefit from Astronics’ avionics, enhanced vision, and simulation/test solutions for assured space access, improved readiness, and reducing launch cycle time."]},{"s":2,"t":103,"st":["Critical technology for sensors and test equipment, enabling rapid contractor development/testing; milestone fit."],"ts":["As a major stakeholder for national security and military launches, USSF demands reliable, ruggedized sensor systems for HUMS, structural health monitoring, and launch test assurance—core to Dytran's offerings.","Their rapid integration needs, cost-sharing approach, and focus on milestone-based contracts fit well with the government's outlined procurement style."]},{"s":2,"t":105,"st":["Advanced multiphysics simulation and mission assurance tools; supports government evaluation role without dictating company design."],"ts":["The Space Force operates/procures next-gen space and launch systems where simulation, reliability, mission planning, and digital thread are critical.","The military’s performance-based, milestone-driven procurement aligns with Ansys’ value proposition—reducing risk, cost, and time to validate system performance.","High emphasis on digital engineering and technical validation, which matches well with Ansys core strength and product-market fit."]},{"s":2,"t":139,"st":["Military-relevant research, classified capabilities, direct work on space domain awareness, launch ops, propulsion, and government/industry integration."],"ts":["Direct alignment with AFIT’s defense and national security mission and classified research capabilities.","USSF’s leadership in military space operations, launch operations, asset protection, and acquisition of critical space systems fits AFIT’s unique federal/military graduate institution role."]},{"s":3,"t":8,"st":["Proven ability for rapid launch, reusability, and commercial business models fully aligned with policy direction (ownership, risk, market-driven).","Deep experience with fixed-price, milestone-based government contracts (e.g., NASA, DoD, NSSL).","Internal culture and history of breakthrough innovation: fits “high risk/high reward” DARPA ethos."],"ts":["Expertise in high-risk, milestone-based innovation, rapid prototyping, and shared tech development.","Ability to co-fund and accelerate high-risk, high-payoff tech projects (advanced launch, autonomy, resilience).","History of transitioning IP and capabilities to industry with companies maintaining own IP."]},{"s":3,"t":9,"st":["Focus on advancing launch technologies, reusability, and heavy-lift—matching aspirations for resilient and cost-effective launch services.","Actively developing both commercial and government launch markets; provides competition in the sector.","Flexible to new contractual and risk structures."],"ts":["Focus on high-risk, high-reward propulsion and launch system innovations matches Blue Origin’s competencies in advanced propulsion (BE-4, BE-3), reusable vehicles, and vertical landings.","Agile, milestone-driven funding structures foster technology acceleration and non-traditional approaches, supporting Blue Origin’s innovation strategy."]},{"s":3,"t":18,"st":["Rapid growth in small and medium-lift with vertically integrated launch solutions.","Value-aligned business model: private capital investment, acceptance of commercial risk, modular offerings.","Open to rapid experimentation, mass production tactics, and innovative, cost-sharing models."],"ts":["High-risk, cutting-edge R&D funding with flexible, milestone-driven contracts; supports tech demonstration and “hard tech” innovation (e.g., advanced payload deployment, new launch paradigms).","Track record in launching dual-use and rapid prototypes."]},{"s":3,"t":19,"st":["Emerging player with proven flight heritage and strong cost-effective engineering—great candidate for agile, milestone-based development.","Willingness and ability to share risk and innovate within government/private partnerships.","Demonstrated market responsiveness and tech agility."],"ts":["DARPA excels at high-risk, high-reward R&D, funding disruptive launch technologies and often employing commercial-style, milestone-based contracts.","A proven track record of tech transition and cost-sharing projects in launch systems, rapid access, and in-space resilience aligns with Firefly’s innovation roadmap."]},{"s":3,"t":20,"st":["Pioneers of 3D-printed, vertically integrated rockets—representing both high-risk tech and potential for disruptive cost/schedule improvement.","Exemplary private investment/market risk model.","Culture of collaboration with government and industry on new manufacturing and launch paradigms."],"ts":["DARPA champions high-risk, high-reward, rapid iteration models, and frequently uses performance-based, milestone-driven, and industry-led R&D contracting.","They offer direct funding for innovative launch, manufacturing, and autonomy, with a strong record for IP and commercialization staying with companies.","Ideal for advancing proprietary manufacturing (AI/robotics/3D printing), which is Relativity’s differentiator."]},{"s":3,"t":21,"st":["Innovation in reusable spaceplanes, habitats, and broad commercial services aligns with evolving, market-driven government support models.","Strong focus on commercial operations and dual-use tech is an ideal fit for DARPA’s technology transfer objectives."],"ts":["High-risk, high-payoff innovation funding; strong track record of stimulating new commercial markets; frequent use of cost-sharing, fixed-price, milestone-based contracts; compatible with policy structure."]},{"s":3,"t":65,"st":["Mobile, container-based launch is highly disruptive/risk-tolerant, matching DARPA’s drive for operational agility and resilience.","Willingness to co-invest makes them suitable for performance-based, cost-shared development contracts.","Rapid tech evolution and startup culture complement mainline innovations."],"ts":["Tech Advancement: As an innovative, risk-tolerant government agency, DARPA is an ideal partner to mature disruptive technologies like mobile launch (GS0), rapid manufacturing, and adaptive missile defense systems.","Funding Model: DARPA supports cost-shared, fixed/firm price contracts and milestone payments, exactly matching the policy structure.","IP Retention: ABL will retain developed IP and know-how, critical given DARPA’s frequent policy of rights vesting with the contractor."]},{"s":3,"t":96,"st":["Specializes in propulsion innovation—a known technology gap and leverage point in launch vehicle economics and responsiveness.","Strong additive manufacturing foundation—synergistic with DARPA’s historical R&D in advanced manufacturing."],"ts":["Expertise in high-risk, high-reward propulsion and hypersonics projects.","Flexible, milestone-based, cost-shared contracting models match the R&D and technological innovation aims of Ursa Major.","Accustomed to private-sector IP retention and commercialization."]},{"s":3,"t":112,"st":["Top academic program for hands-on propulsion/launch training and R&D; historic pipeline to industry and government.","Deep bench in launch and hypersonic technology, plus strong experimental/field test infrastructure for rapid prototyping."],"ts":["Specialized in high-risk, high-reward aerospace/space technology development.","Track record with academic-industry consortia under innovative, flexible contract arrangements.","Agile project/phased funding aligns with policy emphasis on performance-based, milestone-driven progression and rapid development."]},{"s":4,"t":5,"st":["Major launch vehicle and spacecraft manufacturer with proven ability to co-invest and absorb commercial risk.","Capable of executing milestone-based, fixed-price contracts and sharing technical data as needed for government oversight."],"ts":["Regulatory and licensing authority vital for commercial and dual-use launch operations.","Supports Lockheed Martin as a service provider, offering streamlined regulatory compliance and market in const TYPES = [
  {key:'University',           fill:'#f8c0f0', ink:'#b24fa4'},
  {key:'Startup',              fill:'#d0d872', ink:'#868e12'},
  {key:'Mid-sized Enterprise', fill:'#81e4b6', ink:'#23996a'},
  {key:'SME',                  fill:'#95dbf5', ink:'#2585b8'},
  {key:'Large Enterprise',     fill:'#ffbe76', ink:'#c26f14'},
  {key:'Government',           fill:'#ffaeb1', ink:'#c3424c'},

const T = Object.fromEntries(TYPES.map(t=>[t.key,t]));
const NETS = {mission:'Mission-oriented', diffusion:'Diffusion-oriented'};
const SVGNS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);

/* ---------- model ---------- */
const NODES = {};           // id -> {id,label,type,pos:{net:{x,y,r}}, el, lbl}
const NETDATA = {};         // net -> {ids:Set, pairs:[...], pairByKey, adj:Map}
for (const net of Object.keys(NETS)) {
  const d = DATA[net], ids = new Set(), adj = new Map(), pairs = [], pairByKey = {};
  for (const n of d.nodes) {
    const o = NODES[n.id] || (NODES[n.id] = {id:n.id, label:n.label, type:n.type, pos:{}});
    o.pos[net] = {x:n.px, y:n.py, r:n.r};
    ids.add(n.id); adj.set(n.id, []);
  }
  d.edges.forEach((e,i) => {
    const key = Math.min(e.s,e.t)+'-'+Math.max(e.s,e.t);
    const p = {i, key, a:e.s, b:e.t, why:{[e.s]:e.st, [e.t]:e.ts}};
    pairs.push(p); pairByKey[key] = p;

const other = (p, id) => p.a === id ? p.b : p.a;
const byLabel = (a,b) => NODES[a].label.localeCompare(NODES[b].label);

/* ---------- state ---------- */
const S = {
  net:'mission', view:{k:1,x:0,y:0}, fit:{k:1,x:0,y:0},
  hoverNode:null, hoverArc:null,     // hoverArc: {key, from}
  sel:null,                          // {kind:'node', id} | {kind:'edge', key, from, via}
  off:new Set(), anim:null, screen:{} // id -> {x,y,r,o}
};

/* ---------- DOM build ---------- */
const svg = $('#net'), gO = $('#gOver'), gE = $('#gEdges'), gN = $('#gNodes'), gL = $('#gLabels');

// arrow markers per type + neutral

for (const t of TYPES) {

  c.addEventListener('click', e => { e.stopPropagation(); if (justDragged || S.anim || !inNet(n.id) || isOff(n.id)) return; selectNode(n.id); });

// edges per net (two directional arcs + hit paths)

    p.arcs = {};
    for (const from of [p.a, p.b]) {
      const to = other(p, from);
      const vis = mk('path',{class:'arc'}, g);
      const hit = mk('path',{class:'hit'}, g);
      p.arcs[from] = {vis, hit, from, to};
      hit.addEventListener('pointerenter', e => { if (S.anim) return; S.hoverArc = {key:p.key, from}; refresh(); showArcTip(p, from, e); });
      hit.addEventListener('pointermove', e => moveTip(e));
      hit.addEventListener('pointerleave', () => { S.hoverArc = null; refresh(); hideTip(); });
      hit.addEventListener('click', e => { e.stopPropagation(); if (justDragged || S.anim) return; selectEdge(p.key, from); });
    }

/* ---------- geometry ---------- */
const inNet = id => NETDATA[S.net].ids.has(id);
const isOff = id => S.off.has(NODES[id].type);

function fitView(net) {
  const r = svg.getBoundingClientRect(), W = r.width, H = r.height;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for (const id of NETDATA[net].ids) { const p = NODES[id].pos[net]; x0=Math.min(x0,p.x-p.r); y0=Math.min(y0,p.y-p.r); x1=Math.max(x1,p.x+p.r); y1=Math.max(y1,p.y+p.r); }
  const padT = 44, padB = 70, padX = 40;
  const k = Math.min((W-2*padX)/(x1-x0), (H-padT-padB)/(y1-y0));
  return {k, x: (W - (x1-x0)*k)/2 - x0*k, y: padT + ((H-padT-padB) - (y1-y0)*k)/2 - y0*k};
}
function screenPos(net, view, id, fit) {
  const p = NODES[id].pos[net], f = fit || S.fit;
  return {x:p.x*view.k+view.x, y:p.y*view.k+view.y, r:p.r*f.k*Math.pow(view.k/f.k, 0.55)};

const BEND = 0.11;
function arcGeom(A, B, trimEnd) {
  // quadratic from A to B bending to the left of travel direction
  const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy)||1;

  const at = t => ({x:(1-t)*(1-t)*A.x+2*(1-t)*t*C.x+t*t*B.x, y:(1-t)*(1-t)*A.y+2*(1-t)*t*C.y+t*t*B.y});
  const solve = (center, rad, fromEnd) => { // find t where curve leaves circle
    let lo = fromEnd ? 0.5 : 0, hi = fromEnd ? 1 : 0.5;
    for (let i=0;i<18;i++) { const m=(lo+hi)/2, q=at(m), inside=Math.hypot(q.x-center.x,q.y-center.y) < rad;

  const t0 = solve(A, A.r+0.5, false), t1 = solve(B, B.r + trimEnd, true);

  const P0 = at(t0), P1 = at(t1);
  const d0 = {x:(1-t0)*(C.x-A.x)+t0*(B.x-C.x), y:(1-t0)*(C.y-A.y)+t0*(B.y-C.y)};
  const Q = {x:P0.x+(t1-t0)*d0.x, y:P0.y+(t1-t0)*d0.y};
  return `M${P0.x.toFixed(1)},${P0.y.toFixed(1)}Q${Q.x.toFixed(1)},${Q.y.toFixed(1)} ${P1.x.toFixed(1)},${P1.y.toFixed(1)}`;
}

/* ---------- focus logic ---------- */
function focus() {
  // returns {pairs:Set(keys), nodes:Set(ids), strong:{key,from}|null}
  const nd = NETDATA[S.net];
  if (S.hoverArc) { const p = nd.pairByKey[S.hoverArc.key]; return {pairs:new Set([p.key]), nodes:new Set([p.a,p.b]), strong:S.hoverArc}; }
  if (S.hoverNode && inNet(S.hoverNode) && !isOff(S.hoverNode)) return nodeFocus(S.hoverNode, null);
  if (S.sel && S.sel.kind === 'edge' && nd.pairByKey[S.sel.key]) { const p = nd.pairByKey[S.sel.key]; return {pairs:new Set([p.key]), nodes:new Set([p.a,p.b]), strong:{key:p.key, from:S.sel.from}}; }

  return null;
}
function nodeFocus(id, strong) {
  const pairs = new Set(), nodes = new Set([id]);
  for (const p of NETDATA[S.net].adj.get(id)) { if (isOff(other(p,id))) continue; pairs.add(p.key); nodes.add(other(p,id)); }
  return {pairs, nodes, strong, center:id};
}

/* ---------- render ---------- */
function render() {
  const F = S.anim ? null : focus();
  const net = S.net, scr = S.screen;
  // nodes
  for (const n of Object.values(NODES)) {
    const s = scr[n.id];
    if (!s || s.o <= 0.001) { n.el.style.display='none'; n.lbl.style.display='none'; continue; }
    n.el.style.display='';
    n.c.setAttribute('cx', s.x.toFixed(1)); n.c.setAttribute('cy', s.y.toFixed(1)); n.c.setAttribute('r', Math.max(s.r,1.5).toFixed(2));
    n.c.style.strokeWidth = (0.11*s.r + 0.6).toFixed(2);
    let o = s.o;
    if (inNet(n.id)) {
      if (isOff(n.id)) o *= 0.12;
      else if (F && !F.nodes.has(n.id)) o *= 0.18;
    }
    n.el.style.opacity = o;
    n.c.style.pointerEvents = (S.anim || !inNet(n.id) || isOff(n.id)) ? 'none' : 'auto';
  }
  // edges
  const overlay = [];
  for (const nm of Object.keys(NETS)) {
    const g = EDGE_G[nm];
    const visible = S.anim ? (S.anim.edgeOp[nm] > 0.001) : nm === net;
    g.style.display = visible ? '' : 'none';
    if (!visible) continue;
    g.style.opacity = S.anim ? S.anim.edgeOp[nm] : 1;
    for (const p of NETDATA[nm].pairs) {
      const A = scr[p.a], B = scr[p.b];
      const dim = !S.anim && (isOff(p.a) || isOff(p.b));
      for (const from of [p.a, p.b]) {
        const arc = p.arcs[from], Sf = from===p.a?A:B, St = from===p.a?B:A;
        const inF = F && F.pairs.has(p.key);
        const strong = F && F.strong && F.strong.key===p.key && F.strong.from===from;
        const weak = F && F.strong && F.strong.key===p.key && F.strong.from!==from;
        const d = (A && B) ? arcGeom(Sf, St, inF ? 2.5 : 0.5) : '';
        arc.vis.setAttribute('d', d); arc.hit.setAttribute('d', d);
        const st = arc.vis.style;
        if (inF) {
          st.opacity = 0;
          overlay.push({d, type:NODES[from].type, strong, weak});
        } else {
          st.opacity = dim ? .05 : F ? .07 : '';
        }
        arc.hit.style.pointerEvents = (S.anim || dim || nm !== net) ? 'none' : 'stroke';
      }
    }
  }

  overlay.sort((a,b) => (a.strong?1:0) - (b.strong?1:0));
  gO.textContent = '';
  for (const o of overlay) {
    const e = mk('path', {d:o.d, 'marker-end':markerOf(o.type)}, gO);
    e.style.cssText = `fill:none;pointer-events:none;stroke:${T[o.type].ink};stroke-width:${o.strong?2.6:1.4};opacity:${o.strong?1:o.weak?.35:.8}`;
  }
  renderLabels(F);
}

function renderLabels(F) {
  const placed = [];
  const scr = S.screen;
  const ids = Object.keys(scr).map(Number).filter(id => scr[id].o > .5 && inNet(id));
  const prio = id => (F && F.nodes.has(id) ? 1e6 : 0) + (F && (F.center===id || (F.strong && (id===F.strong.from))) ? 1e7 : 0) + scr[id].r;
  ids.sort((a,b) => prio(b) - prio(a));
  for (const n of Object.values(NODES)) n.lbl.style.display = 'none';
  if (S.anim && S.anim.t < .92) return;
  for (const id of ids) {
    const n = NODES[id], s = scr[id];
    if (isOff(id)) continue;
    const focused = F && F.nodes.has(id);
    if (F && !focused) continue;
    if (!F && s.r < 4.5) continue;
    const w = n.lw + 6, h = 15;
    const cands = focused ? [[0,0],[0,s.r+9],[0,-s.r-9],[s.r+w/2+3,0],[-s.r-w/2-3,0]] : [[0,0]];
    let ok = null;
    for (const [dx,dy] of cands) {
      const cx = s.x+dx, cy = s.y+dy, box = {x0:cx-w/2, x1:cx+w/2, y0:cy-h/2, y1:cy+h/2};
      if (!placed.some(b => !(box.x1<b.x0 || box.x0>b.x1 || box.y1<b.y0 || box.y0>b.y1))) { ok = {cx, cy, box}; break; }
    }
    if (!ok) continue;
    placed.push(ok.box);
    n.lbl.style.display = '';
    n.lbl.setAttribute('x', ok.cx.toFixed(1)); n.lbl.setAttribute('y', ok.cy.toFixed(1));
    n.lbl.style.opacity = S.anim ? (S.anim.t-.92)/.08 : 1;
  }
}

function computeScreen() {
  const scr = {};
  for (const id of NETDATA[S.net].ids) scr[id] = {...screenPos(S.net, S.view, id), o:1};
  S.screen = scr;
}
let rq = 0;
function refresh() { if (rq) return; rq = requestAnimationFrame(() => { rq = 0; if (!S.anim) computeScreen(); render(); }); }

/* ---------- zoom & pan ---------- */
function setView(v, animate) {
  if (!animate) { S.view = v; refresh(); return; }
  const v0 = {...S.view}, t0 = performance.now(), D = 520;
  const step = now => { let t = Math.min(1,(now-t0)/D); t = t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    S.view = {k:v0.k+(v.k-v0.k)*t, x:v0.x+(v.x-v0.x)*t, y:v0.y+(v.y-v0.y)*t}; computeScreen(); render();
    if (t<1 && !S.anim) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function zoomAt(f, cx, cy, animate) {
  const v = S.view, k = Math.max(S.fit.k*0.6, Math.min(S.fit.k*14, v.k*f)), r = k/v.k;
  setView({k, x: cx-(cx-v.x)*r, y: cy-(cy-v.y)*r}, animate);
}
svg.addEventListener('wheel', e => {
  e.preventDefault(); if (S.anim) return;
  const r = svg.getBoundingClientRect();
  zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?0.01:0.0016)), e.clientX-r.left, e.clientY-r.top, false);
}, {passive:false});
let drag = null;
svg.addEventListener('pointerdown', e => { if (S.anim || e.button!==0) return; drag = {x:e.clientX, y:e.clientY, v:{...S.view}, moved:false, id:e.pointerId}; });
let justDragged = false;
window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!(e.buttons & 1)) { drag = null; svg.classList.remove('drag'); return; }
  const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
  if (!drag.moved && Math.hypot(dx,dy) > 3) { drag.moved = true; svg.classList.add('drag'); hideTip(); }
  if (drag.moved) { S.view = {k:drag.v.k, x:drag.v.x+dx, y:drag.v.y+dy}; refresh(); }
});
window.addEventListener('pointerup', () => { justDragged = !!(drag && drag.moved); if (justDragged) svg.classList.remove('drag'); drag = null; setTimeout(()=>{justDragged=false},0); });
svg.addEventListener('click', e => { if (justDragged) return; if (e.target === svg) { S.sel = null; refresh(); renderPanel(); } });
svg.addEventListener('pointerleave', () => { if (S.hoverArc || S.hoverNode) { S.hoverArc = S.hoverNode = null; refresh(); } hideTip(); });
const center = () => { const r = svg.getBoundingClientRect(); return [r.width/2, r.height/2]; };
$('#zin').onclick = () => zoomAt(1.6, ...center(), true);
$('#zout').onclick = () => zoomAt(1/1.6, ...center(), true);
$('#zfit').onclick = () => setView(S.fit, true);
window.addEventListener('resize', () => { S.fit = fitView(S.net); S.view = {...S.fit}; refresh(); });

/* ---------- network switch (animated) ---------- */
function switchNet(net) {
  if (net === S.net || S.anim) return;
  hideTip(); S.hoverArc = null; S.hoverNode = null;
  const from = S.net, vFrom = {...S.view}, fFrom = {...S.fit}, vTo = fitView(net);
  const ids = new Set([...NETDATA[from].ids, ...NETDATA[net].ids]);
  const D = 1400, t0 = performance.now();
  const ease = t => t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const clamp = x => Math.max(0,Math.min(1,x));
  S.anim = {t:0, edgeOp:{[from]:1, [net]:0}};
  setSeg(net);
  $('#kicker').style.opacity = 0;
  const step = now => {
    const t = Math.min(1,(now-t0)/D), m = ease(clamp((t-.12)/.76));
    S.anim.t = t;
    S.anim.edgeOp = {[from]: 1-clamp(t/.15), [net]: clamp((t-.84)/.16)};
    const scr = {};
    for (const id of ids) {
      const a = NETDATA[from].ids.has(id), b = NETDATA[net].ids.has(id);
      const P = a ? screenPos(from, vFrom, id, fFrom) : null, Q = b ? screenPos(net, vTo, id, vTo) : null;
      if (a && b) scr[id] = {x:P.x+(Q.x-P.x)*m, y:P.y+(Q.y-P.y)*m, r:P.r+(Q.r-P.r)*m, o:1};
      else if (a) scr[id] = {...P, r:P.r*(1-.4*clamp(t/.4)), o:1-clamp(t/.38)};
      else scr[id] = {...Q, r:Q.r*(.6+.4*clamp((t-.55)/.4)), o:clamp((t-.55)/.35)};
    }
    if (t >= 0.5 && S.net !== net) { S.net = net; }   // edge hit-testing & inNet switch midway
    S.screen = scr; render();
    if (t < 1) requestAnimationFrame(step);
    else {
      S.anim = null; S.net = net; S.fit = vTo; S.view = {...vTo};
      $('#kicker').textContent = NETS[net] + ' policy'; $('#kicker').style.opacity = 1;
      // keep selection if it exists in new network
      if (S.sel && S.sel.kind==='edge' && !NETDATA[net].pairByKey[S.sel.key]) S.sel = S.sel.via ? {kind:'node', id:S.sel.via} : null;
      computeScreen(); render(); renderPanel();
      if (S.pending) { const f = S.pending; S.pending = null; f(); }
    }
  };
  requestAnimationFrame(step);
}
function setSeg(net) {
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.net===net));
  const b = document.querySelector(`#seg button[data-net="${net}"]`), th = $('#thumb');
  th.style.left = b.offsetLeft+'px'; th.style.width = b.offsetWidth+'px';
}
document.querySelectorAll('#seg button').forEach(b => b.onclick = () => switchNet(b.dataset.net));

/* ---------- selection ---------- */
function selectNode(id, zoom) {
  S.sel = {kind:'node', id}; refresh(); renderPanel();
  if (zoom) {
    const s = screenPos(S.net, S.view, id), [cx, cy] = center();
    const k = Math.max(S.view.k, S.fit.k*1.8), p = NODES[id].pos[S.net];
    setView({k, x: cx - p.x*k, y: cy - p.y*k}, true);
  }
}
function selectEdge(key, from, via) {
  const prevVia = S.sel && (S.sel.kind==='node' ? S.sel.id : S.sel.via);
  S.sel = {kind:'edge', key, from, via: via ?? prevVia ?? null};
  refresh(); renderPanel();
}
document.addEventListener('keydown', e => { if (e.key==='Escape' && document.activeElement !== $('#q')) { S.sel = null; refresh(); renderPanel(); } });

/* ---------- tooltip ---------- */
const tip = $('#tip');
function showNodeTip(n, e) {
  if (!inNet(n.id) || isOff(n.id)) return;
  tip.innerHTML = `<div class="t1"><span class="dot" style="background:${T[n.type].fill}"></span>${esc(n.label)}</div>
    <div class="t2">${esc(n.type)} · ${NETDATA[S.net].adj.get(n.id).length} partners</div>`;
  tip.style.maxWidth = '300px'; tip.classList.add('show'); moveTip(e);
}
const nameTag = n => `<span class="nt"><span class="dot" style="background:${T[n.type].fill}"></span>${esc(n.label)}</span>`;
function reasonList(items, ink) { return `<ul class="r" style="--c:${ink}">${items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`; }
function showArcTip(p, from, e) {
  const to = other(p, from), A = NODES[from], B = NODES[to];
  tip.innerHTML = `<div class="t1">${nameTag(A)}<span class="arr">→</span>${nameTag(B)}</div>
    <div class="t2">Why ${esc(A.label)} chose ${esc(B.label)}</div>
    ${reasonList(p.why[from], T[A.type].ink)}
    <div class="foot">Click to pin both directions</div>`;
  tip.style.maxWidth = '380px'; tip.classList.add('show'); moveTip(e);
}
function moveTip(e) {
  const pad = 16, r = tip.getBoundingClientRect();
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = Math.max(8, innerHeight - r.height - 8);
  tip.style.left = x+'px'; tip.style.top = y+'px';
}
function hideTip() { tip.classList.remove('show'); }

/* ---------- panel ---------- */
const panel = $('#panel');
const ICON_CHEV = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>';
function renderPanel() {
  const sel = S.sel, net = S.net, nd = NETDATA[net];
  let h = '';
  if (!sel) {
    h = `<div class="pane intro"><div class="k">${NETS[net]} policy</div>
      <h2>Why did they choose each other?</h2>
      <p>Each link joins two organizations that both expressed an intention to collaborate. Every link carries two rationales, one from each side.</p>
      <ul class="how">
        <li><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 18C8 8 16 8 20 18"/><path d="m17 15 3 3 1-4"/></svg></span><div><b>Hover a link</b>Each link is drawn as two arcs. Hover one to read that side's rationale.</div></li>
        <li><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="6"/></svg></span><div><b>Click an organization</b>List its partners and open any pair to compare both rationales.</div></li>
        <li><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg></span><div><b>Switch policy</b>Keep an organization selected to see how its partners change.</div></li>
      </ul></div>`;
  } else if (sel.kind === 'node') {
    const n = NODES[sel.id];
    if (!inNet(sel.id)) {
      const there = Object.keys(NETS).find(k => NETDATA[k].ids.has(sel.id));
      h = `<div class="pane"><div class="k">Organization</div><h2>${esc(n.label)}</h2>
        <div class="meta"><span class="pill"><span class="dot" style="background:${T[n.type].fill}"></span>${esc(n.type)}</span></div>
        <div class="note">Not in this network. This organization has no mutual links under the ${NETS[net].toLowerCase()} policy.
        ${there ? `<br><button class="btn" data-go="${there}">View in ${NETS[there]}</button>` : ''}</div></div>`;
    } else {
      const ps = nd.adj.get(sel.id).slice().sort((p,q) => byLabel(other(p,sel.id), other(q,sel.id)));
      h = `<div class="pane"><div class="k">Organization · ${NETS[net]}</div><h2>${esc(n.label)}</h2>
        <div class="meta"><span class="pill"><span class="dot" style="background:${T[n.type].fill}"></span>${esc(n.type)}</span><span>${ps.length} mutual partner${ps.length===1?'':'s'}</span></div>
        <div class="sec"><div class="k">Partners</div><div class="plist">
        ${ps.map(p => { const o = NODES[other(p,sel.id)];
          return `<div class="prow" data-key="${p.key}" data-from="${sel.id}"><span class="dot" style="background:${T[o.type].fill}"></span><span class="nm">${esc(o.label)}</span><span class="ty">${esc(o.type)}</span>${ICON_CHEV}</div>`; }).join('')}
        </div></div></div>`;
    }
  } else {
    const p = nd.pairByKey[sel.key];
    const first = sel.from, second = other(p, first);
    const card = (f, t) => { const A = NODES[f], B = NODES[t], ink = T[A.type].ink;
      return `<div class="card" data-from="${f}" style="--c:${ink}"><div class="ch">${nameTag(A)}<span class="arr">→</span>${nameTag(B)}</div>
        <div class="cs">Why ${esc(A.label)} chose ${esc(B.label)}</div>${reasonList(p.why[f], ink)}</div>`; };
    h = `<div class="pane">${sel.via && nd.ids.has(sel.via) ? `<button class="back" data-back="${sel.via}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>${esc(NODES[sel.via].label)}</button>` : ''}
      <div class="k">Mutual link · ${NETS[net]}</div>
      <h2>${esc(NODES[first].label)}<span class="x">⇄</span>${esc(NODES[second].label)}</h2>
      ${card(first, second)}${card(second, first)}</div>`;
  }
  panel.innerHTML = h;
  panel.scrollTop = 0;
  panel.querySelectorAll('.prow').forEach(r => {
    const p = nd.pairByKey[r.dataset.key];
    r.onclick = () => selectEdge(r.dataset.key, +r.dataset.from, +r.dataset.from);
    r.onmouseenter = () => { S.hoverArc = {key:p.key, from:+r.dataset.from}; refresh(); };
    r.onmouseleave = () => { S.hoverArc = null; refresh(); };
  });
  panel.querySelectorAll('.card').forEach(c => {
    c.onmouseenter = () => { S.hoverArc = {key:sel.key, from:+c.dataset.from}; refresh(); markCards(); };
    c.onmouseleave = () => { S.hoverArc = null; refresh(); markCards(); };
  });
  const back = panel.querySelector('[data-back]'); if (back) back.onclick = () => selectNode(+back.dataset.back);
  const go = panel.querySelector('[data-go]'); if (go) go.onclick = () => switchNet(go.dataset.go);
  markCards();
}
function markCards() {
  const strong = S.hoverArc && S.sel && S.sel.kind==='edge' && S.hoverArc.key===S.sel.key ? S.hoverArc.from : (S.sel && S.sel.kind==='edge' ? S.sel.from : null);
  panel.querySelectorAll('.card').forEach(c => c.classList.toggle('hl', +c.dataset.from === strong));
}

/* ---------- legend / filter ---------- */
const legend = $('#legend');
for (const t of TYPES) {
  const b = document.createElement('button'); b.className = 'chip';
  b.innerHTML = `<span class="dot" style="background:${t.fill};border:1.5px solid ${darken(t.fill,.5)};box-shadow:none"></span>${t.key}`;
  b.onclick = () => { S.off.has(t.key) ? S.off.delete(t.key) : S.off.add(t.key); b.classList.toggle('off', S.off.has(t.key)); resetChip.classList.toggle('show', S.off.size>0); refresh(); };
  legend.appendChild(b);
}
const resetChip = document.createElement('button'); resetChip.className = 'chip reset'; resetChip.textContent = 'Show all';
resetChip.onclick = () => { S.off.clear(); legend.querySelectorAll('.chip').forEach(c=>c.classList.remove('off')); resetChip.classList.remove('show'); refresh(); };
legend.appendChild(resetChip);

/* ---------- search ---------- */
const q = $('#q'), res = $('#results');
const ALL = Object.values(NODES).sort((a,b)=>a.label.localeCompare(b.label));
let hits = [], act = 0;
function runSearch() {
  const s = q.value.trim().toLowerCase();
  if (!s) { res.classList.remove('open'); return; }
  hits = ALL.filter(n => n.label.toLowerCase().includes(s)).sort((a,b) => a.label.toLowerCase().indexOf(s) - b.label.toLowerCase().indexOf(s)).slice(0, 10);
  act = 0; drawResults();
}
function drawResults() {
  res.innerHTML = hits.length ? hits.map((n,i) => {
    const here = inNet(n.id), there = Object.keys(NETS).find(k => k!==S.net && NETDATA[k].ids.has(n.id));
    const tag = here ? '' : `<span class="tag">${there ? 'Only in '+NETS[there].split('-')[0] : 'Not in this network'}</span>`;
    return `<div class="res${i===act?' act':''}" data-i="${i}"><span class="dot" style="background:${T[n.type].fill}"></span><span class="nm">${esc(n.label)}</span>${tag}</div>`;
  }).join('') : '<div class="res empty">No matching organization</div>';
  res.classList.add('open');
  res.querySelectorAll('.res[data-i]').forEach(r => { r.onmousedown = e => { e.preventDefault(); pick(hits[+r.dataset.i]); }; r.onmouseenter = () => { act = +r.dataset.i; res.querySelectorAll('.res').forEach((x,j)=>x.classList.toggle('act', j===act)); }; });
}
function pick(n) {
  q.value = n.label; res.classList.remove('open'); q.blur();
  if (isOff(n.id)) { S.off.delete(n.type); legend.querySelectorAll('.chip').forEach((c,i)=>{ if (TYPES[i] && TYPES[i].key===n.type) c.classList.remove('off'); }); resetChip.classList.toggle('show', S.off.size>0); }
  if (inNet(n.id)) selectNode(n.id, true);
  else {
    const there = Object.keys(NETS).find(k => NETDATA[k].ids.has(n.id));
    if (there) { S.sel = {kind:'node', id:n.id}; S.pending = () => selectNode(n.id, true); switchNet(there); }
  }
}
q.addEventListener('input', runSearch);
q.addEventListener('focus', runSearch);
q.addEventListener('blur', () => setTimeout(()=>res.classList.remove('open'), 120));
q.addEventListener('keydown', e => {
  if (!res.classList.contains('open') || !hits.length) return;
  if (e.key==='ArrowDown') { act = (act+1)%hits.length; drawResults(); e.preventDefault(); }
  else if (e.key==='ArrowUp') { act = (act-1+hits.length)%hits.length; drawResults(); e.preventDefault(); }
  else if (e.key==='Enter') { pick(hits[act]); e.preventDefault(); }
  else if (e.key==='Escape') { res.classList.remove('open'); q.blur(); }
});

/* ---------- init ---------- */
function init() {
  for (const n of Object.values(NODES)) { n.lw = n.lbl.getComputedTextLength() || n.label.length*6.2; }
  S.fit = fitView(S.net); S.view = {...S.fit};
  setSeg(S.net); computeScreen(); render(); renderPanel();
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(init); else init();
</script>
</body>
</html>
